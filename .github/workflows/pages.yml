# SPDX-License-Identifier: GPL-3.0-only
# Builds the groovebox site (tools/make_emu_site.sh) on every push to main and publishes it with GitHub Pages.
# Once, in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      WASI_SYSROOT: ${{ github.workspace }}/../wasi/wasi-sysroot-25.0
      WASI_RT: ${{ github.workspace }}/../wasi/libclang_rt.builtins-wasm32-wasi-25.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libfribidi0 zip
          pip install numpy scipy pillow markdown fonttools
          mkdir -p ../wasi && cd ../wasi
          base=https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25
          curl -sSfL "$base/wasi-sysroot-25.0.tar.gz" | tar xz
          curl -sSfL "$base/libclang_rt.builtins-wasm32-wasi-25.0.tar.gz" | tar xz
      - name: Generate
        run: python -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Site
        run: sh tools/make_emu_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/spelunkr-groovebox-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
